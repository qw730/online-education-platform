# Frontend Nginx configuration for the three-tier (compose) deployment.
# Differences from the single-image docker/nginx.conf:
#   * /api is proxied to the "backend" service over the compose network
#     (Docker's internal DNS resolves the service name), not to localhost.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite assets are immutable -> cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API -> backend container, port 8080, inside the compose network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vue Router history mode: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
