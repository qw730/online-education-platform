<svg viewBox="0 0 680 528" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Container diagram for the Online Personal Education Platform</title>
<desc>The system holds three containers: a Vue single page application on port 5173, a Spring Boot API application on port 8080, and a MySQL 8 database with twelve tables. Students and administrators use the SPA through a web browser; the SPA calls the API with JSON over HTTP and the API reads and writes the database over JDBC.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-size="15" font-weight="500" fill="#2C2C2A">Container diagram</text>
<text x="40" y="54" font-size="13" fill="#5F5E5A">Online Personal Education Platform · C4 level 2</text>

<rect x="36" y="137" width="120" height="76" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="96" y="158" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Student</text>
<text x="96" y="176" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Role.STUDENT</text>
<text x="96" y="192" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">learns &amp; enrols</text>

<rect x="36" y="243" width="120" height="76" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="96" y="264" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Administrator</text>
<text x="96" y="282" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Role.ADMIN</text>
<text x="96" y="298" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">authors &amp; manages</text>

<rect x="186" y="92" width="268" height="372" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="116" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">Online Personal Education Platform</text>

<rect x="204" y="136" width="232" height="78" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="158" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">Web application (SPA)</text>
<text x="320" y="175" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Vue 3 · Vite · Pinia · Element Plus</text>
<text x="320" y="192" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">22 views · :5173 · JWT in browser storage</text>

<path d="M320 214 L320 240" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="328" y="227" font-size="11" fill="#185FA5">JSON / HTTP</text>

<rect x="204" y="242" width="232" height="78" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="264" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">API application</text>
<text x="320" y="281" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Spring Boot 3.3 · Spring Data JPA · JJWT</text>
<text x="320" y="298" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">10 controllers · 7 services · 12 entities</text>

<path d="M320 320 L320 346" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="328" y="333" font-size="11" fill="#185FA5">JDBC</text>

<rect x="204" y="348" width="232" height="78" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="370" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">Database</text>
<text x="320" y="387" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">MySQL 8 · database online_education</text>
<text x="320" y="404" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">12 InnoDB · utf8mb4 tables</text>

<path d="M156 175 L184 175" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="170" y="167" font-size="11" text-anchor="middle" fill="#5F5E5A">uses</text>

<path d="M156 281 L184 281" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="170" y="273" font-size="11" text-anchor="middle" fill="#5F5E5A">uses</text>

<rect x="484" y="137" width="140" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="554" y="158" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">Web browser</text>
<text x="554" y="176" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">runs the SPA</text>

<path d="M482 175 L456 175" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<text x="469" y="167" font-size="11" text-anchor="middle" fill="#0F6E56">hosts</text>

<text x="40" y="490" font-size="11" fill="#5F5E5A">Deployment: the SPA ships as static Vite assets, the API as a Spring Boot jar — two processes on one machine.</text>
<text x="40" y="508" font-size="11" fill="#5F5E5A">Build-time only: Maven Central · npm registry.  Tests: H2 in-memory.  No cache, broker or external identity provider.</text>
</svg>
