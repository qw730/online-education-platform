<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>System context diagram for the Online Personal Education Platform</title>
<desc>A student and an administrator use the platform through a web browser. The system boundary contains a Vue single page application on port 5173 and a Spring Boot service on port 8080. The only runtime external system is a MySQL 8 server on localhost:3306.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-size="15" font-weight="500" fill="#2C2C2A">System context diagram</text>
<text x="40" y="54" font-size="13" fill="#5F5E5A">Online Personal Education Platform · C4 level 1</text>

<rect x="36" y="120" width="140" height="76" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="106" y="146" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Student</text>
<text x="106" y="164" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Role.STUDENT</text>
<text x="106" y="180" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">learns &amp; enrols</text>

<rect x="36" y="236" width="140" height="76" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="106" y="262" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Administrator</text>
<text x="106" y="280" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Role.ADMIN</text>
<text x="106" y="296" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">authors &amp; manages</text>

<rect x="228" y="96" width="224" height="272" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="120" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">Online Personal Education Platform</text>

<rect x="246" y="142" width="188" height="82" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="166" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">Frontend SPA</text>
<text x="340" y="186" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Vue 3 · Vite · Pinia</text>
<text x="340" y="204" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Element Plus · :5173</text>

<path d="M340 224 L340 250" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="348" y="237" font-size="11" fill="#185FA5">JSON / HTTP</text>

<rect x="246" y="254" width="188" height="82" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="278" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">Backend Service</text>
<text x="340" y="298" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Spring Boot 3.3 · JPA</text>
<text x="340" y="316" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">JWT auth · :8080</text>

<path d="M176 158 L226 158" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="201" y="151" font-size="11" text-anchor="middle" fill="#5F5E5A">learns</text>

<path d="M176 274 L226 274" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="201" y="267" font-size="11" text-anchor="middle" fill="#5F5E5A">manages</text>

<rect x="510" y="120" width="140" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="580" y="148" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">Web browser</text>
<text x="580" y="168" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">hosts the SPA</text>

<rect x="510" y="236" width="140" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="580" y="264" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">MySQL 8</text>
<text x="580" y="284" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">localhost:3306</text>
<text x="580" y="300" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">12 tables</text>

<path d="M508 158 L454 158" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<text x="481" y="151" font-size="11" text-anchor="middle" fill="#0F6E56">renders</text>

<path d="M454 274 L508 274" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<text x="481" y="267" font-size="11" text-anchor="middle" fill="#0F6E56">JDBC</text>

<text x="40" y="400" font-size="11" fill="#5F5E5A">Build-time only: Maven Central · npm registry · H2 in-memory for tests</text>
<text x="40" y="418" font-size="11" fill="#5F5E5A">Out of scope: email/SMS · payments · file uploads · external identity provider</text>
</svg>
